name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting is feature-independent, so it runs once.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  # Exactly one generator feature must be enabled, so clippy is run once per
  # generator: a bare `cargo clippy` would hit the no-generator compile_error.
  clippy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [xoroshiro128pp, mixmax, mixmax17, mixmax256, "mixmax17,mixmax-lux", minstd, mrg5, mrg32k3a, mrg32k3a-c1, mt19937-64, splitmix, philox4x64]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (${{ matrix.features }})
        run: cargo clippy --all-targets --features ${{ matrix.features }} -- -D warnings

  # Tests, on stable, across every generator. Each generator gates its own code
  # (the MIXMAX bit-exactness vectors in particular), so a single feature would
  # leave the others untested.
  test:
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    strategy:
      matrix:
        features: [xoroshiro128pp, mixmax, mixmax17, mixmax256, "mixmax17,mixmax-lux", minstd, mrg5, mrg32k3a, mrg32k3a-c1, mt19937-64, splitmix, philox4x64]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (${{ matrix.features }})
        run: RUST_BACKTRACE=full cargo test --features ${{ matrix.features }} --verbose

  # Coverage. Since exactly one generator feature can be enabled, no single
  # tarpaulin run can reach all of `prng.rs`: we run one per generator and let
  # Coveralls merge the partial reports (parallel build mode), finalized by the
  # `coverage-finish` job below.
  coverage:
    name: coverage (${{ matrix.features }})
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    container:
      image: xd009642/tarpaulin:develop-nightly
      options: --security-opt seccomp=unconfined
    strategy:
      matrix:
        include:
          - features: xoroshiro128pp
            flag: xoroshiro128pp
          - features: mixmax
            flag: mixmax
          - features: mixmax17
            flag: mixmax17
          - features: mixmax256
            flag: mixmax256
          - features: "mixmax17,mixmax-lux"
            flag: mixmax17-lux
          - features: minstd
            flag: minstd
          - features: mrg5
            flag: mrg5
          - features: mrg32k3a
            flag: mrg32k3a
          - features: mrg32k3a-c1
            flag: mrg32k3a-c1
          - features: mt19937-64
            flag: mt19937-64
          - features: splitmix
            flag: splitmix
          - features: philox4x64
            flag: philox4x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate code coverage
        run: |
          cargo +nightly tarpaulin --verbose --engine llvm --features ${{ matrix.features }} --out Lcov

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: "lcov.info"
          flag-name: ${{ matrix.flag }}
          parallel: true

  # Tells Coveralls that every partial report has been uploaded, so it can merge
  # them into the single figure shown by the badge.
  coverage-finish:
    needs: coverage
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Coveralls finished
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
